set -g status-left-length 200
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

bind-key Q confirm-before -p "Kill session '#S'? (y/n)" "kill-session"
bind C-c attach-session -t . -c "#{pane_current_path}" \; display "Session path updated!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "arcticicestudio/nord-tmux"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum auto-saves the resurrect snapshot on a timer, so a crash
# doesn't lose everything since the last manual `prefix + Ctrl-s`.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
# Restore the last environment automatically when the tmux server starts.
# Set to 'off' if you'd rather restore by hand with `prefix + Ctrl-r`.
set -g @continuum-restore 'on'

# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
# Restores the pane with `nvim -S` when a Session.vim exists in the pane's
# directory. lua/custom/session.lua in the nvim config keeps that file current.
set -g @resurrect-strategy-nvim 'session'
# Bring back scrollback contents for non-editor panes too.
set -g @resurrect-capture-pane-contents 'on'

# Use vi keys in copy mode
set -g mode-keys vi

# Enter copy mode with prefix + [  (default, just making it explicit)
# v to begin selection, y to yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
